<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Mã Công Đoạn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --primary-hover: #1e293b;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --success: #10b981;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; display: flex; justify-content: center; }
        .desktop-container { width: 100%; max-width: 1200px; padding: 40px 24px; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
        .header-title h1 { font-size: 28px; margin: 0 0 8px 0; font-weight: 700; }
        .header-title p { margin: 0; color: var(--text-muted); font-size: 15px; }
        .user-badge { display: flex; align-items: center; background: var(--bg-surface); padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .user-badge span.dot { width: 8px; height: 8px; background-color: var(--success); border-radius: 50%; margin-right: 8px; }
        .toolbar { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 20px; margin-bottom: 24px; background: var(--bg-surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
        
        input[type="text"], select { width: 100%; padding: 12px 16px; font-size: 15px; font-family: inherit; border: 1px solid var(--border); border-radius: 8px; outline: none; background-color: var(--bg-body); transition: all 0.2s; box-sizing: border-box; }
        select:disabled, input[type="text"]:disabled { background-color: #f1f5f9; cursor: not-allowed; color: #94a3b8; }
        input[type="text"]:focus, select:focus { border-color: var(--accent); background-color: var(--bg-surface); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        /* CẬP NHẬT CSS: Khung cuộn và cố định tiêu đề */
        .table-container { 
            background: var(--bg-surface); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            overflow-y: auto; /* Cho phép cuộn dọc */
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            max-height: 60vh; /* Giới hạn chiều cao khung để xuất hiện thanh cuộn */
            min-height: 300px; 
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { 
            background-color: #f8fafc; 
            padding: 16px 20px; 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            border-bottom: 1px solid var(--border);
            position: sticky; /* Cố định vị trí */
            top: 0; /* Gắn sát mép trên */
            z-index: 10; /* Đè lên các nội dung cuộn bên dưới */
        }
        th::after { /* Giữ liền mạch đường viền dưới của tiêu đề khi cuộn */
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            border-bottom: 1px solid var(--border);
        }
        td { padding: 16px 20px; font-size: 15px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tbody tr:hover { background-color: var(--accent-light); }
        
        .product-name { font-weight: 600; color: var(--primary); }
        .machine-path { color: var(--text-muted); font-size: 14px; }
        .machine-path strong { color: #334155; }
        .code-badge { display: inline-block; background-color: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); padding: 6px 12px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 16px; }
        
        .empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); }
        .empty-state h3 { margin: 16px 0 8px 0; color: var(--primary); }

        .loading-spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="desktop-container">
    <div class="header">
        <div class="header-title">
            <h1>Tra Cứu Mã Công Đoạn</h1>  
        </div>
        <div class="user-badge">
            <span class="dot"></span> Ngành Trung Thế
        </div>
    </div>

    <div class="toolbar">
        <div class="form-group">
            <label>Cấp 1: Cụm Máy</label>
            <select id="level1Select" onchange="updateLevel2()">
                <option value="all">-- Chọn cụm máy --</option>
                <option value="keo">Máy Kéo</option>
                <option value="61s">Máy 61S</option>
                <option value="ccvl">Máy CCVL</option>
                <option value="giap_bang">Giáp Băng</option>
                <option value="drum">Máy Drum</option>
                <option value="may_150">Máy 150</option>
            </select>
        </div>

        <div class="form-group">
            <label>Cấp 2: Công Đoạn</label>
            <select id="level2Select" onchange="handleLevel2Change()" disabled>
                <option value="all">-- Vui lòng chọn cụm máy --</option>
            </select>
        </div>

        <div class="form-group">
            <label>Cấp 3: Quy cách / Tên sản phẩm</label>
            <input type="text" id="searchInput" placeholder="Nhập quy cách để hiển thị kết quả..." oninput="filterData()">
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th width="40%">Quy cách Sản phẩm</th>
                    <th width="35%">Tiến trình / Máy vận hành</th>
                    <th width="25%">Mã Công Đoạn</th>
                </tr>
            </thead>
            <tbody id="resultBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // ==========================================
    // 1. CẤU HÌNH API GOOGLE SHEETS
    // ==========================================
    const webAppUrl = "https://script.google.com/macros/s/AKfycbxaZsWW7eiSI85oHEYbq5AfroT2e4QgkLE5ufIAcNb2c8BtDo6rcYwAEHqFyPHlog4Q/exec"; 
    
    let data = []; 

    const categoryMapping = {
        "giap_bang": [
            { value: "gb_dong", label: "Giáp Băng Đồng" },
            { value: "gb_nhom", label: "Giáp Băng Nhôm" },
            { value: "gb_thep", label: "Giáp Băng Thép" },
            { value: "gb_mica", label: "Giáp Băng Mica" }
        ],
        "drum": [
            { value: "dt_giapsoi", label: "Giáp Sợi" },
            { value: "dt_xoannhom", label: "Xoắn Nhóm" },
            { value: "dt_giapbang", label: "Giáp Băng" }
        ],
        "may_150": [
            { value: "150_bpc", label: "Bọc Phân Cách" },
            { value: "150_bv", label: "Bọc Vỏ" }
        ]
    };

    const resultBody = document.getElementById('resultBody');
    const level1Select = document.getElementById('level1Select');
    const level2Select = document.getElementById('level2Select');
    const searchInput = document.getElementById('searchInput');

    function disableSearch() {
        searchInput.disabled = true;
        searchInput.value = ""; 
        searchInput.placeholder = "⚠️ Vui lòng chọn Công Đoạn ở Cấp 2...";
    }

    function enableSearch() {
        searchInput.disabled = false;
        searchInput.placeholder = "Nhập quy cách để hiển thị kết quả...";
    }

    function updateLevel2() {
        const selectedLevel1 = level1Select.value;
        level2Select.innerHTML = '';
        
        if (selectedLevel1 === 'all') {
            level2Select.innerHTML = '<option value="all">-- Vui lòng chọn cụm máy --</option>';
            level2Select.disabled = true;
            enableSearch(); 
        } 
        else if (categoryMapping[selectedLevel1]) {
            level2Select.disabled = false;
            level2Select.innerHTML = '<option value="all">-- Vui lòng chọn công đoạn --</option>'; 
            
            const subCategories = categoryMapping[selectedLevel1];
            subCategories.forEach(sub => {
                const option = document.createElement('option');
                option.value = sub.value;
                option.textContent = sub.label;
                level2Select.appendChild(option);
            });
            disableSearch();
        } 
        else {
            level2Select.innerHTML = '<option value="all">-- Không phân cấp --</option>';
            level2Select.disabled = true;
            enableSearch(); 
        }
        
        filterData();
    }

    function handleLevel2Change() {
        const selectedLevel1 = level1Select.value;
        const selectedLevel2 = level2Select.value;
        
        if (categoryMapping[selectedLevel1] && selectedLevel2 === 'all') {
            disableSearch();
        } else {
            enableSearch(); 
            searchInput.focus();
        }
        
        filterData();
    }

    function renderTable(displayData, stateType) {
        resultBody.innerHTML = ''; 
        
        if (displayData.length === 0) {
            if (stateType === "init") {
                resultBody.innerHTML = `
                    <tr>
                        <td colspan="3">
                            <div class="empty-state">
                                <div style="font-size: 40px; margin-bottom: 12px;">⌨️</div>
                                <h3>Sẵn sàng tra cứu</h3>
                                <p>Hệ thống đã kết nối. Vui lòng gõ quy cách sản phẩm để lấy mã.</p>
                            </div>
                        </td>
                    </tr>
                `;
            } else if (stateType === "loading") {
                resultBody.innerHTML = `
                    <tr>
                        <td colspan="3">
                            <div class="empty-state">
                                <div class="loading-spinner"></div>
                                <h3>Đang đồng bộ dữ liệu...</h3>
                                <p>Vui lòng chờ trong giây lát để tải Master Data từ hệ thống.</p>
                            </div>
                        </td>
                    </tr>
                `;
            } else if (stateType === "error") {
                resultBody.innerHTML = `
                    <tr>
                        <td colspan="3">
                            <div class="empty-state">
                                <div style="font-size: 40px; margin-bottom: 12px;">⚠️</div>
                                <h3 style="color: var(--danger);">Lỗi kết nối máy chủ</h3>
                                <p>Không thể tải dữ liệu. Vui lòng kiểm tra mạng hoặc tải lại trang (F5).</p>
                            </div>
                        </td>
                    </tr>
                `;
            } else {
                resultBody.innerHTML = `
                    <tr>
                        <td colspan="3">
                            <div class="empty-state">
                                <div style="font-size: 40px; margin-bottom: 12px;">🔍</div>
                                <h3>Không có kết quả</h3>
                                <p>Không tìm thấy mã công đoạn nào khớp với điều kiện lọc hiện tại.</p>
                            </div>
                        </td>
                    </tr>
                `;
            }
            return;
        }

        displayData.forEach(item => {
            const pathHtml = item.level2Name 
                ? `<strong>${item.level1Name}</strong> ➔ ${item.level2Name}` 
                : `<strong>${item.level1Name}</strong>`;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="product-name">${item.product}</td>
                <td class="machine-path">${pathHtml}</td>
                <td><span class="code-badge">${item.code}</span></td>
            `;
            resultBody.appendChild(row);
        });
    }

    function filterData() {
        if (data.length === 0) return;

        const valL1 = level1Select.value;
        const valL2 = level2Select.value;
        
        let searchText = searchInput.disabled ? "" : searchInput.value.toLowerCase().trim();
        searchText = searchText.replace(/,/g, '.');

        if (searchText === "") {
            renderTable([], "init");
            return;
        }

        const filtered = data.filter(item => {
            const matchL1 = (valL1 === 'all') || (item.level1 === valL1);
            const matchL2 = (valL2 === 'all') || (item.level2 === valL2) || (item.level2 === "");
            
            const normalizedProduct = (item.product || "").toLowerCase().replace(/,/g, '.');
            const normalizedCode = (item.code || "").toLowerCase().replace(/,/g, '.');
            
            const matchText = normalizedProduct.includes(searchText) || normalizedCode.includes(searchText);
            
            return matchL1 && matchL2 && matchText;
        });

        renderTable(filtered, "search");
    }

    // ==========================================
    // 2. HÀM KẾT NỐI API & TẢI DỮ LIỆU TỪ GOOGLE SHEETS
    // ==========================================
    async function fetchMasterData() {
        renderTable([], "loading");
        
        try {
            const response = await fetch(webAppUrl);
            if (!response.ok) throw new Error("Lỗi kết nối API Google Sheets");
            
            const rawData = await response.json();
            
            // KIỂM TRA LỖI: Báo sai tên Sheet hoặc cấu trúc trả về
            if (rawData.error) {
                console.error("Lỗi từ Apps Script:", rawData.error);
                alert("Lỗi máy chủ: " + rawData.error + "\\nVui lòng kiểm tra lại tên Sheet trong Apps Script!");
                renderTable([], "error");
                return;
            }
            if (!Array.isArray(rawData)) {
                console.error("Dữ liệu trả về bị sai cấu trúc:", rawData);
                renderTable([], "error");
                return;
            }
            
            data = rawData;
            filterData(); 
        } catch (error) {
            console.error("Lỗi khi tải dữ liệu:", error);
            renderTable([], "error"); 
        }
    }

    window.onload = () => {
        fetchMasterData();
    };
</script>

</body>
</html>
